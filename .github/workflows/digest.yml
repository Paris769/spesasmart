name: Digest settimanale

on:
  schedule:
    # Ogni lunedì alle 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (non scrive nel DB, non invia email)"
        required: false
        default: "false"
        type: boolean

jobs:
  digest:
    name: Digest spesa abituale
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installa dipendenze backend
        run: pip install -r backend/requirements.txt

      - name: Esegui digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Opzionali: se mancano il job NON fallisce (il digest salta LLM/email)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python scripts/weekly_digest.py $FLAGS

      - name: Carica digest come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digests
          path: state/digests/
          if-no-files-found: ignore
          retention-days: 30

      - name: Notifica fallimento
        if: failure()
        run: |
          echo "::error::Digest fallito — controlla i log sopra"
