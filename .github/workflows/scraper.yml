name: Scraper prezzi

on:
  schedule:
    # Ogni notte alle 03:00 CET (02:00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain da scrapare"
        required: false
        default: "all"
        type: choice
        options: [all, esselunga, conad, carrefour, coop, lidl, eurospin, aldi, md, penny, iper, pam, famila, cosicomodo, images, dedup, prune]
      dry_run:
        description: "Dry run (non scrive nel DB)"
        required: false
        default: "false"
        type: boolean
      discover_only:
        description: "Solo discovery negozi"
        required: false
        default: "false"
        type: boolean

# Un solo run alla volta: due scrape in parallelo si contenderebbero le
# connessioni del pooler e si spegnerebbero i prezzi a vicenda.
concurrency:
  group: scraper-prezzi
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Catena singola (avvio manuale) ─────────────────────────────────────────
  singola:
    name: Scrape ${{ inputs.chain }}
    if: github.event_name == 'workflow_dispatch' && inputs.chain != 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scraping/requirements.txt
      - run: pip install -r scraping/requirements.txt
      - name: Esegui scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.discover_only }}" = "true" ]; then FLAGS="$FLAGS --discover-only"; fi
          python -m scraping.runner --chain "${{ inputs.chain }}" $FLAGS

  # ── Run completo: prune → catene in parallelo → dedup ──────────────────────
  # Prima era tutto in sequenza in un unico job: ~90-120 minuti, e il 22/08 il
  # run e' morto per timeout a meta' lavoro. Le catene sono indipendenti fra
  # loro, quindi girano in parallelo e il tempo totale scende a quello della
  # catena piu' lenta (Carrefour, ~35 min).
  pulizia:
    name: Prune storico
    if: github.event_name == 'schedule' || inputs.chain == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scraping/requirements.txt
      - run: pip install -r scraping/requirements.txt
      - name: Prune
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraping.runner --chain prune

  catene:
    name: ${{ matrix.chain }}
    needs: pulizia
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Una catena che fallisce non deve fermare le altre 11.
      fail-fast: false
      # Tetto al parallelismo: il pooler del database ha un numero limitato di
      # connessioni, e con troppi job insieme cadono a meta' scrittura.
      max-parallel: 4
      matrix:
        chain: [esselunga, conad, carrefour, eurospin, iper, coop, pam, penny, aldi, lidl, md, famila]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scraping/requirements.txt
      - run: pip install -r scraping/requirements.txt
      - name: Scrape ${{ matrix.chain }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraping.runner --chain ${{ matrix.chain }}

  unifica:
    name: Dedup prodotti
    needs: catene
    # Gira anche se qualche catena e' fallita: i duplicati delle altre vanno
    # comunque uniti.
    if: always() && needs.catene.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scraping/requirements.txt
      - run: pip install -r scraping/requirements.txt
      - name: Dedup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraping.runner --chain dedup
