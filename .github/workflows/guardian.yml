name: Guardian (agente autonomo)

# Agente di sorveglianza e auto-riparazione SpesaSmart.
# Gira ogni 6 ore: sonda gli endpoint dei cataloghi (rileva i cambi-API che
# zittiscono uno spider), controlla salute/spazio del DB, freschezza e
# copertura dati, e auto-ripara (dedup, ri-scrape). Fallisce SOLO quando
# serve l'uomo: API cambiata (fix spider) o DB non scrivibile.

on:
  schedule:
    # Ogni 6 ore. Il run delle 00 UTC e' quello completo (copertura e
    # freschezza per catena, ~2 GB di letture); gli altri tre sono ridotti.
    # Cron separati perche' l'ora di avvio non e' affidabile: GitHub li fa
    # partire con 4-6 ore di ritardo.
    - cron: "0 0 * * *"
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      heal:
        description: "Livello auto-riparazione"
        required: false
        default: "safe"
        type: choice
        options: [safe, all]
      check_only:
        description: "Solo diagnosi (nessuna azione)"
        required: false
        default: "false"
        type: boolean

jobs:
  guardian:
    name: Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping/requirements.txt

      - name: Installa dipendenze
        run: pip install -r scraping/requirements.txt

      - name: Esegui Guardian
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # "0" solo per i tre run ridotti; un lancio a mano e' sempre completo.
          GUARDIAN_FULL_CHECK: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 0 * * *') && '0' || '1' }}
        run: |
          FLAGS="--heal ${{ inputs.heal || 'safe' }} --json-out guardian-report.json"
          if [ "${{ inputs.check_only }}" = "true" ]; then FLAGS="--check-only --json-out guardian-report.json"; fi
          python -m scraping.guardian $FLAGS

      - name: Salva report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report
          path: guardian-report.json
          if-no-files-found: ignore
          retention-days: 14
