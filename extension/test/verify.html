<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Test flusso agente — Esselunga</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; padding: 16px; }
      pre { background: #f5f5f4; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
      .pass { color: #15803d; } .fail { color: #dc2626; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Test flusso agente — adapter Esselunga</h1>
    <p>Eseguito contro il <strong>DOM reale</strong> catturato da spesaonline.esselunga.it.</p>
    <div id="stage" style="display:none"></div>
    <pre id="out">running…</pre>

    <script type="module">
      import { SELECTORS, pageIsLoggedIn, pageAddToCart, pageAddConfirmed, pageDiagnostics }
        from "../adapters/esselunga.js";
      import { buildProductPage } from "./fixture-esselunga.js";

      const log = [];
      const assert = (name, cond) => log.push({ name, ok: !!cond });
      const stage = document.getElementById("stage");

      /** Monta la pagina fixture e collega il comportamento reale del sito:
       *  il click su "Aggiungi" mostra il toast (rimuove ng-hide). */
      function mount(opts) {
        stage.innerHTML = buildProductPage(opts);
        const btn = stage.querySelector('button[aria-label^="Aggiungi al carrello"]');
        const state = { clicked: false, qtyAtClick: null };
        if (btn && !btn.disabled) {
          btn.addEventListener("click", () => {
            state.clicked = true;
            const sel = stage.querySelector("select.esselunga-product-quantity-select");
            state.qtyAtClick = sel ? sel.value : null;
            stage.querySelector("#actionFeedback").classList.remove("ng-hide");
          });
        }
        return state;
      }
      // L'adapter usa document.querySelector: la fixture è nel documento, ok.

      // ── T1: rilevamento login ────────────────────────────────────────────
      mount({ logged: false });
      assert("T1a ospite → isLoggedIn = false", pageIsLoggedIn(SELECTORS) === false);
      mount({ logged: true });
      assert("T1b loggato → isLoggedIn = true", pageIsLoggedIn(SELECTORS) === true);

      // ── T2: aggiunta con quantità (formato Angular value="number:N") ─────
      let st = mount({ logged: true });
      assert("T2a conferma FALSA prima del click", pageAddConfirmed(SELECTORS) === false);
      const r2 = pageAddToCart(SELECTORS, 3);
      assert("T2b addToCart → 'added'", r2.status === "added");
      assert("T2c bottone realmente cliccato", st.clicked === true);
      assert("T2d quantità impostata su 'number:3'", st.qtyAtClick === "number:3");
      assert("T2e conferma VERA dopo il click (toast)", pageAddConfirmed(SELECTORS) === true);

      // ── T3: quantità 1 (nessun cambio necessario) ────────────────────────
      st = mount({ logged: true });
      const r3 = pageAddToCart(SELECTORS, 1);
      assert("T3a addToCart qty=1 → 'added'", r3.status === "added");
      assert("T3b quantità resta 'number:1'", st.qtyAtClick === "number:1");

      // ── T4: prodotto esaurito → NON deve dire 'added' ────────────────────
      st = mount({ logged: true, outOfStock: true });
      const r4 = pageAddToCart(SELECTORS, 1);
      assert("T4a esaurito → status 'blocked'", r4.status === "blocked");
      assert("T4b nessun click su bottone disabilitato", st.clicked === false);
      assert("T4c nessuna conferma toast", pageAddConfirmed(SELECTORS) === false);

      // ── T5: pagina senza bottone → 'not_found' + diagnostica utile ───────
      stage.innerHTML = "<div>pagina inattesa</div>";
      const r5 = pageAddToCart(SELECTORS, 1);
      assert("T5a pagina inattesa → 'not_found'", r5.status === "not_found");
      const d5 = pageDiagnostics(SELECTORS);
      assert("T5b diagnostica segnala addBtn assente", d5.addBtn === null);
      assert("T5c diagnostica include url", typeof d5.url === "string" && d5.url.length > 0);

      // ── T6: diagnostica su pagina valida trova gli elementi ──────────────
      mount({ logged: true });
      const d6 = pageDiagnostics(SELECTORS);
      assert("T6a diagnostica trova il bottone aggiungi", !!d6.addBtn);
      assert("T6b diagnostica trova il select quantità", !!d6.qtySelect);
      assert("T6c diagnostica vede il toast", d6.feedbackPresent === true);

      // ── Report ───────────────────────────────────────────────────────────
      const failed = log.filter((l) => !l.ok);
      document.getElementById("out").innerHTML =
        log.map((l) => `<span class="${l.ok ? "pass" : "fail"}">${l.ok ? "PASS" : "FAIL"} — ${l.name}</span>`).join("\n") +
        `\n\nRESULT: ${failed.length === 0 ? "ALL PASS" : failed.length + " FAILED"} (${log.length} test)`;
    </script>
  </body>
</html>
